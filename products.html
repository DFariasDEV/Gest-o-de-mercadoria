<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de estoque</title>
  <link rel="stylesheet" href="home.css">

  <style>
    /* Notificação de estoque baixo: fixa no canto, não altera o layout */
    #notificacao {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 500;
      font-family: Arial, Helvetica, sans-serif;
    }

    #notificacao #sino {
      background-color: #fff3cd;
      color: #664d03;
      border: 2px solid #e69a1f;
      border-radius: 20px;
      padding: 4px 12px;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    #notificacao #painelalerta,
    #notificacao #toastalerta {
      position: absolute;
      right: 0;
      top: 38px;
      width: 280px;
      background-color: white;
      color: #664d03;
      border: 2px solid #e69a1f;
      border-radius: 10px;
      padding: 8px;
      box-sizing: border-box;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    #notificacao #painelalerta {
      max-height: 260px;
      overflow-y: auto;
    }

    #notificacao .alerta-item {
      display: block;
      width: 100%;
      text-align: left;
      background-color: #fff3cd;
      color: #664d03;
      border: 1px solid #e69a1f;
      border-radius: 8px;
      padding: 4px 8px;
      margin-top: 6px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    #notificacao .alerta-item:hover {
      background-color: #ffe69c;
    }

    /* Aba lateral (histórico): fica por cima, à direita, sem mexer no layout */
    #painellateral {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: 360px;
      max-width: 92vw;
      z-index: 800;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      background-color: white;
      color: #222;
      border-left: 2px solid #555;
      box-shadow: -4px 0 12px rgba(0, 0, 0, 0.3);
      font-family: Arial, Helvetica, sans-serif;
      transform: translateX(100%);
      visibility: hidden;
      transition: transform 0.25s ease, visibility 0.25s;
    }

    #painellateral.aberto {
      transform: translateX(0);
      visibility: visible;
    }

    #painellateral .pl-topo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background-color: #333;
      color: white;
      padding: 12px 14px;
    }

    #painellateral .pl-topo h2 {
      margin: 0;
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    #painellateral #plfechar {
      background: none;
      border: none;
      color: white;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
    }

    #painellateral .pl-abas {
      display: flex;
      border-bottom: 2px solid #555;
    }

    #painellateral .pl-abas button {
      flex: 1;
      padding: 10px 6px;
      background-color: #ecebeb;
      color: #333;
      border: none;
      border-right: 1px solid #bbb;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    #painellateral .pl-abas button.ativa {
      background-color: rgb(62, 172, 62);
      color: white;
    }

    #painellateral ul {
      list-style: none;
      margin: 0;
      padding: 0 12px 12px;
      overflow-y: auto;
      flex: 1;
    }

    #painellateral li {
      padding: 9px 0;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
    }

    #painellateral li.vazio {
      color: #777;
      border-bottom: none;
    }

    #painellateral .mov-entrada { color: #1e8e1e; font-weight: bold; margin-right: 8px; }
    #painellateral .mov-baixa { color: #c9302c; font-weight: bold; margin-right: 8px; }
    #painellateral .mov-status { color: #e69a1f; font-weight: bold; margin-right: 8px; }
    #painellateral .mov-detalhe { color: #555; }

    /* Janela de senha */
    #modalsenha { z-index: 1000; }
    #modalsenha input { display: block; width: 100%; box-sizing: border-box; margin: 4px 0 10px; }
    #modalsenha p.nota { font-size: 13px; color: #555; margin: 0 0 10px; }
    #modalsenha #erro-senha { color: #d9534f; font-weight: bold; margin: 0; min-height: 18px; }
  </style>
</head>

<body>

<header>
  <!-- Notificação de estoque baixo (fixa no canto, não muda o layout) -->
  <div id="notificacao" style="display:none;">
    <button type="button" id="sino" onclick="alternarPainelAlerta()">🔔 <span id="contadoralerta">0</span></button>
    <div id="toastalerta" style="display:none;"></div>
    <div id="painelalerta" style="display:none;"></div>
  </div>

  <h1 style="font-family: Arial, Helvetica, sans-serif; color: white;">GESTÃO DE ESTOQUE</h1>
  <br>

  <hr>

  <label for="nomedoproduto" id="nomecss">Nome do produto:</label>
  <input id="nomedoproduto" type="text">

  <label for="quantidadeproduto" id="produtocss">Quantidade:</label>
  <input id="quantidadeproduto" type="text">

  <button type="button" onclick="adicionar()" class="registrob">Registrar</button>

  <p id="mensagemerro"></p>

  <div class="barrabusca">
    <label for="busca" id="buscacss">Buscar por código ou nome:</label>
    <input id="busca" type="text" placeholder="Digite o código ou nome" oninput="filtrar()">

    <button type="button" onclick="limparBusca()" class="limparb">Limpar</button>
    
    <!-- Botão para filtrar apenas indisponíveis -->
    <button type="button" id="btnFiltroIndisponiveis" onclick="alternarFiltroIndisponiveis()" class="arquivob" style="margin-left: 10px;">Ver indisponíveis</button>
  </div>

  <div class="barraarquivo">
    <button type="button" onclick="exportar()" class="arquivob">Salvar backup (arquivo)</button>
    <button type="button" onclick="document.getElementById('arquivo').click()" class="arquivob">Carregar backup</button>
    <button type="button" onclick="gerarRelatorio()" class="arquivob">Gerar relatório</button>
    <button type="button" onclick="alterarSenha()" class="arquivob">Alterar senha</button>
    <input id="arquivo" type="file" accept=".json,application/json" style="display:none" onchange="importar(event)">
    <span id="msgarquivo"></span>
  </div>
</header>

<div class="areaprodutos">
  <h3 style="font-family: Arial, Helvetica, sans-serif;">Produtos registrados recentemente:</h3>
  <p id="msgbusca"></p>
  <div id="produtosq"></div>
</div>

<!-- Janela de entrada / saída (sobreposição) -->
<div id="modal" class="modal-fundo">
  <div class="modal-caixa">
    <h2 id="modaltitulo">Movimentar estoque</h2>

    <p id="modalproduto"></p>

    <label for="movqtd">Quantidade:</label>
    <input id="movqtd" type="text">

    <p id="erroedicao"></p>

    <div class="modal-botoes">
      <button type="button" id="btnconfirmarmov" class="btn-entrada" onclick="confirmarMovimento()">Confirmar</button>
      <button type="button" class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
    </div>
  </div>
</div>

<!-- Aba lateral: histórico do produto (entradas/saídas e indisponibilidade) -->
<aside id="painellateral" aria-hidden="true">
  <div class="pl-topo">
    <h2 id="histtitulo">Histórico</h2>
    <button type="button" id="plfechar" onclick="fecharHistorico()" aria-label="Fechar">&times;</button>
  </div>

  <div class="pl-abas">
    <button type="button" id="abamov" class="ativa" onclick="trocarAba('mov')">Entradas e saídas</button>
    <button type="button" id="abastatus" onclick="trocarAba('status')">Indisponibilidade</button>
  </div>

  <ul id="listamov"></ul>
  <ul id="listastatus" style="display:none;"></ul>
</aside>

<!-- Janela de confirmação de exclusão (sobreposição) -->
<div id="modalexcluir" class="modal-fundo">
  <div class="modal-caixa">
    <h2>Excluir produto</h2>

    <p id="excluirtexto"></p>

    <div class="modal-botoes">
      <button type="button" class="btn-baixa" onclick="confirmarExclusao()">Excluir</button>
      <button type="button" class="btn-cancelar" onclick="fecharExcluir()">Cancelar</button>
    </div>
  </div>
</div>

<!-- Janela de senha (sobreposição) -->
<div id="modalsenha" class="modal-fundo">
  <div class="modal-caixa">
    <h2 id="senhatitulo">Senha</h2>

    <p id="senhanota" class="nota"></p>

    <div id="campoatual">
      <label for="senhaatual" id="labelatual">Senha:</label>
      <input id="senhaatual" type="password" autocomplete="off">
    </div>

    <div id="camponova">
      <label for="senhanova" id="labelnova">Nova senha:</label>
      <input id="senhanova" type="password" autocomplete="off">
    </div>

    <div id="camporepetir">
      <label for="senharepetir">Repita a senha:</label>
      <input id="senharepetir" type="password" autocomplete="off">
    </div>

    <p id="erro-senha"></p>

    <div class="modal-botoes">
      <button type="button" class="btn-entrada" onclick="confirmarSenha()">Confirmar</button>
      <button type="button" class="btn-cancelar" onclick="fecharSenha()">Cancelar</button>
    </div>
  </div>
</div>

<script src="app.js"></script>

</body>
</html>
